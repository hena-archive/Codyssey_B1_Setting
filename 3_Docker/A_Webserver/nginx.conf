events {}

http {
    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
    
    server {
        listen 444;

        root /usr/share/nginx/html;
        index after.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
